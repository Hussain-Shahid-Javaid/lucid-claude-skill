<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="How Lucid works: save, recall, correct, hand off" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How Lucid works</title>
<rect width="1200" height="700" rx="18" fill="#0e1117"/>
<text x="40" y="58" fill="#e6e9ef" font-size="30" font-weight="800" letter-spacing="-0.5">How Lucid works</text>
<text x="40" y="88" fill="#9aa3b2" font-size="17">Your assistant keeps reasoning. Lucid keeps the record: local, inspectable, with provenance.</text>
<text x="40" y="132" fill="#9aa3b2" font-size="13" font-weight="700" letter-spacing="1.5">YOUR AI TOOLS</text>
<text x="440" y="132" fill="#9aa3b2" font-size="13" font-weight="700" letter-spacing="1.5">LUCID CORE  (local SQLite, ~/.lucid)</text>
<text x="900" y="132" fill="#9aa3b2" font-size="13" font-weight="700" letter-spacing="1.5">WHERE CONTEXT GOES</text>
<g><rect x="40" y="150" width="300" height="72" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="58" y="180" fill="#e6e9ef" font-size="19" font-weight="600">Claude Code</text><text x="58" y="204" fill="#9aa3b2" font-size="15">/lucid skill + CLI</text></g>
<g><rect x="40" y="250" width="300" height="72" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="58" y="280" fill="#e6e9ef" font-size="19" font-weight="600">Any MCP client</text><text x="58" y="304" fill="#9aa3b2" font-size="15">lucid mcp (stdio)</text></g>
<g><rect x="40" y="350" width="300" height="72" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="58" y="380" fill="#e6e9ef" font-size="19" font-weight="600">ChatGPT · Claude.ai · Gemini</text><text x="58" y="404" fill="#9aa3b2" font-size="15">export files → import</text></g>
<rect x="440" y="150" width="380" height="372" rx="16" fill="#141821" stroke="#8ea2ff" stroke-opacity="0.45" stroke-width="2"/>
<g><rect x="460" y="172" width="340" height="64" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="478" y="202" fill="#e6e9ef" font-size="19" font-weight="600">Memory + provenance</text><text x="478" y="226" fill="#9aa3b2" font-size="15">origin · evidence · scope · expiry</text></g>
<g><rect x="460" y="262" width="340" height="64" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="478" y="292" fill="#e6e9ef" font-size="19" font-weight="600">Conflicts · history · tombstones</text><text x="478" y="316" fill="#9aa3b2" font-size="15">never silently overwritten</text></g>
<g><rect x="460" y="352" width="340" height="64" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="478" y="382" fill="#e6e9ef" font-size="19" font-weight="600">Tasks · budgets · timed decisions</text><text x="478" y="406" fill="#9aa3b2" font-size="15">completion checked in code</text></g>
<g><rect x="460" y="442" width="340" height="64" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="478" y="472" fill="#e6e9ef" font-size="19" font-weight="600">Conversation archive</text><text x="478" y="496" fill="#9aa3b2" font-size="15">branches kept · re-imports idempotent</text></g>
<g><rect x="860" y="150" width="300" height="72" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="878" y="180" fill="#e6e9ef" font-size="19" font-weight="600">Context handoff</text><text x="878" y="204" fill="#9aa3b2" font-size="15">only categories you allow</text></g>
<g><rect x="860" y="250" width="300" height="72" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="878" y="280" fill="#e6e9ef" font-size="19" font-weight="600">Local dashboard</text><text x="878" y="304" fill="#9aa3b2" font-size="15">lucid serve · 127.0.0.1</text></g>
<g><rect x="860" y="350" width="300" height="72" rx="12" fill="#1a1e26" stroke="#2a303b" stroke-width="2"/><text x="878" y="380" fill="#e6e9ef" font-size="19" font-weight="600">S3 / Google Docs mirror</text><text x="878" y="404" fill="#9aa3b2" font-size="15">opt-in, per category</text></g>
