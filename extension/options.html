<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="font: 14px system-ui; max-width: 480px; margin: 24px;">
  <h1>Lucid Capture options</h1>
  <label>Lucid service URL <input id="api" style="width:100%" placeholder="http://127.0.0.1:8765"></label><br><br>
  <label>Access token <input id="token" type="password" style="width:100%"></label>
  <p>The token is printed by <code>lucid serve</code> (or rotate with <code>python -m lucid.server.app --rotate-token</code>).</p>
  <button id="save">Save</button> <span id="msg"></span>
  <script src="options.js"></script>
</body></html>
