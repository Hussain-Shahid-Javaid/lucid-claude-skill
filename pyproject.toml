[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-skill"
version = "0.3.0"
description = "Lucid: portable AI skill with provenance-tracked memory, context handoff, budgets, timed decisions, verification and research tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hussain Shahid Javaid" }]
dependencies = []  # core + CLI + MCP stdio use only the standard library

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.27"]
s3 = ["boto3>=1.34"]
gdocs = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27", "boto3>=1.34", "moto[s3]>=5", "ruff>=0.6",
       "mypy>=1.10", "pip-audit>=2.7", "playwright>=1.45"]

[project.scripts]
lucid = "lucid.cli:main"
lucid-mcp = "lucid.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lucid = ["migrations/*.sql", "data/*.json", "data/*.jsonl", "web/**/*", "avatar/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires live provider credentials (skipped by default)",
]
addopts = "-q -m 'not live'"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["skill/lucid/scripts/lib", "dashboard", "extension", "brag-output*"]

[tool.ruff.lint]
# Release gate lint set: syntax errors, pyflakes, bugbear, bandit-style security checks.
select = ["E9", "F", "B", "S", "PLE"]
# B008: defaults are the immutable Scope dataclass or FastAPI's Body(); both are safe.
# B905: zip() strictness is a style choice here; the inputs are built together.
# S603: subprocess is always called with an argument list, never a shell.
# S311: `random` is used only for seeded simulations in evals and research, never for secrets.
ignore = ["B008", "B905", "S603", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
files = ["src/lucid"]
ignore_missing_imports = true
